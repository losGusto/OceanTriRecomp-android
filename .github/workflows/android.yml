name: android-apk
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - uses: hendrikmuhs/ccache-action@v1.2
        with: { key: mh3-android, max-size: 2G }
      - name: Android SDK
        run: |
          bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses' >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.31.6" "platforms;android-34" "build-tools;34.0.0"
      - name: Gerar projeto Android
        run: |
          echo '' | base64 -d | gunzip > make_android.sh
          echo "9be587b90f860001dd7f1cedaf12b1cd55e4186e6ad34584b5217c9a3016d2a7  make_android.sh" | sha256sum -c
          bash make_android.sh
      - name: Compilar APK
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
      - name: Resumo do erro
        if: failure()
        run: |
          echo "=== primeiras linhas de erro ==="
          grep -n -m 30 -E "CMake Error|FAILED:|error:|fatal error|undefined reference|undefined symbol|No such file|Could not" build.log | cut -c1-260 || true
          echo "=== contexto do primeiro CMake Error ==="
          grep -n -m 1 -A14 "CMake Error" build.log | cut -c1-260 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MH3-apk-e-log
          path: |
            android/app/build/outputs/apk/release/*.apk
            build.log
          if-no-files-found: warn
